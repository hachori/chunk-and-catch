<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Chunk & Catch — 직독직해 도우미</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script>
      // JSX를 classic 런타임(React.createElement)으로 변환 — 브라우저 인라인 스크립트용
      Babel.registerPreset('classic-react', {
        presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]],
      });
    </script>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
      .spin { animation: spin 1s linear infinite; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-presets="classic-react">
      const { useState, useEffect, useRef } = React;

      const readFileAsDataUrl = (file) =>
        new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다.'));
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(file);
        });

      // 원본에서 (선택 영역만) 잘라낸 뒤 축소 + JPEG 압축.
      // crop 은 0~1 정규화 좌표 {x0,y0,x1,y1}, null 이면 전체.
      // ⚠️ 축소본이 아니라 '원본'에서 잘라야 작은 영역을 골라도 글자가 선명하다.
      const renderImage = (src, crop, maxSize = 1600, quality = 0.85) =>
        new Promise((resolve, reject) => {
          const img = new Image();
          img.onerror = () => reject(new Error('이미지를 불러올 수 없습니다.'));
          img.onload = () => {
            const c = crop || { x0: 0, y0: 0, x1: 1, y1: 1 };
            const sx = Math.round(c.x0 * img.width);
            const sy = Math.round(c.y0 * img.height);
            const sw = Math.max(1, Math.round((c.x1 - c.x0) * img.width));
            const sh = Math.max(1, Math.round((c.y1 - c.y0) * img.height));
            let w = sw, h = sh;
            if (w > maxSize || h > maxSize) {
              const ratio = Math.min(maxSize / w, maxSize / h);
              w = Math.round(w * ratio);
              h = Math.round(h * ratio);
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            resolve({ dataUrl, base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
          };
          img.src = src;
        });

      // ── 단어장 저장 계층 ─────────────────────────────────────────
      // config.js 가 비어 있거나 ?local=1 이면 localStorage 로 동작한다.
      // 두 구현이 같은 인터페이스(list/add/remove/update)를 가지므로
      // 화면 코드는 어느 쪽인지 몰라도 된다. (morning-meds 와 같은 패턴)
      const cfg = window.APP_CONFIG || {};
      const isLocalMode =
        !cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY ||
        new URLSearchParams(location.search).has('local');

      const sb = isLocalMode
        ? null
        : window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

      const LOCAL_KEY = 'chunk-and-catch-vocab';

      const localVocabStore = {
        _load() {
          try {
            const db = JSON.parse(localStorage.getItem(LOCAL_KEY)) || {};
            return { items: db.items || [], seq: db.seq || 1 };
          } catch (_) {
            return { items: [], seq: 1 };
          }
        },
        _save(db) {
          try { localStorage.setItem(LOCAL_KEY, JSON.stringify(db)); } catch (_) {}
        },
        async list() {
          return this._load().items.slice().sort((a, b) => (a.created_at < b.created_at ? 1 : -1));
        },
        async add(entry) {
          const db = this._load();
          const row = {
            id: db.seq++,
            known: false,
            review_count: 0,
            wrong_count: 0,
            last_reviewed_at: null,
            created_at: new Date().toISOString(),
            ...entry,
          };
          db.items.push(row);
          this._save(db);
          return row;
        },
        async remove(id) {
          const db = this._load();
          db.items = db.items.filter((r) => r.id !== id);
          this._save(db);
        },
        async update(id, patch) {
          const db = this._load();
          db.items = db.items.map((r) => (r.id === id ? { ...r, ...patch } : r));
          this._save(db);
        },
      };

      const supaVocabStore = {
        async list() {
          const { data, error } = await sb
            .from('vocab_entries').select('*').order('created_at', { ascending: false });
          if (error) throw error;
          return data;
        },
        async add(entry) {
          const { data, error } = await sb
            .from('vocab_entries').insert(entry).select().single();
          if (error) throw error;
          return data;
        },
        async remove(id) {
          const { error } = await sb.from('vocab_entries').delete().eq('id', id);
          if (error) throw error;
        },
        async update(id, patch) {
          const { error } = await sb.from('vocab_entries').update(patch).eq('id', id);
          if (error) throw error;
        },
      };

      const vocabStore = isLocalMode ? localVocabStore : supaVocabStore;

      // 같은 단어인지 판정하는 키 (대소문자 무시)
      const vocabKey = (type, term) => type + '|' + String(term).trim().toLowerCase();

      function LoginForm({ onSubmit }) {
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const [mode, setMode] = useState('login');   // login | signup
        const isSignup = mode === 'signup';
        return (
          <form className="space-y-3 max-w-sm mx-auto py-4"
            onSubmit={(e) => { e.preventDefault(); onSubmit(email, password, mode); }}>
            <p className="text-sm text-slate-500 text-center">
              단어장은 기기 간 동기화를 위해 로그인이 필요합니다.
            </p>
            <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)}
              placeholder="이메일" autoComplete="username"
              className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
            <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)}
              placeholder="비밀번호" autoComplete="current-password"
              className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
            <button type="submit"
              className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-colors">
              {isSignup ? '계정 만들기' : '로그인'}
            </button>
            <button type="button" onClick={() => setMode(isSignup ? 'login' : 'signup')}
              className="w-full text-sm text-slate-400 hover:text-indigo-600 transition-colors">
              {isSignup ? '이미 계정이 있어요 — 로그인하기' : '처음이신가요? 계정 만들기'}
            </button>
          </form>
        );
      }

      function App() {
        const [activeTab, setActiveTab] = useState('image');
        const [textInput, setTextInput] = useState('');
        const [imagePreview, setImagePreview] = useState(null);
        const [originalSrc, setOriginalSrc] = useState(null);
        const [crop, setCrop] = useState(null);
        const [isLoading, setIsLoading] = useState(false);
        const [result, setResult] = useState(null);
        const [error, setError] = useState('');

        // ── 단어장 상태 ──
        const [view, setView] = useState('analyze');       // analyze | vocab | cards
        const [vocab, setVocab] = useState([]);
        const [session, setSession] = useState(null);
        const [vocabError, setVocabError] = useState('');
        const [vocabNotice, setVocabNotice] = useState('');
        const [query, setQuery] = useState('');
        const [hideMeaning, setHideMeaning] = useState(false);
        const [revealed, setRevealed] = useState({});       // 뜻 가리기 중 개별 공개
        const [onlyUnknown, setOnlyUnknown] = useState(false);
        // ── 플래시카드 상태 ──
        const [deck, setDeck] = useState([]);
        const [cardIdx, setCardIdx] = useState(0);
        const [flipped, setFlipped] = useState(false);
        const [cardResults, setCardResults] = useState({}); // id -> true(앎)/false(모름)

        useEffect(() => {
          if ('speechSynthesis' in window) {
            const warm = () => window.speechSynthesis.getVoices();
            warm();
            window.speechSynthesis.addEventListener('voiceschanged', warm);
            return () => window.speechSynthesis.removeEventListener('voiceschanged', warm);
          }
        }, []);

        const handleSpeak = (text, langCode) => {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.rate = 0.9;
            u.lang = langCode;
            const voices = window.speechSynthesis.getVoices();
            const voice =
              voices.find((v) => v.lang.includes(langCode) && v.localService) ||
              voices.find((v) => v.lang.includes(langCode));
            if (voice) u.voice = voice;
            window.speechSynthesis.speak(u);
          } else {
            setError('현재 브라우저에서는 음성 듣기 기능을 지원하지 않습니다. Chrome, Safari, Edge 등을 사용해 주세요.');
          }
        };

        const processImageFile = async (file) => {
          if (!file) return;
          try {
            const src = await readFileAsDataUrl(file);
            const preview = await renderImage(src, null);
            setOriginalSrc(src);
            setImagePreview(preview.dataUrl);
            setCrop(null);
          } catch (e) {
            console.error(e);
            setError('이미지를 처리하지 못했습니다. 다른 파일로 시도해 주세요.');
          }
        };

        const handleImageUpload = (e) => processImageFile(e.target.files[0]);

        useEffect(() => {
          const handlePaste = (e) => {
            if (activeTab !== 'image') return;
            const items = e.clipboardData && e.clipboardData.items;
            if (!items) return;
            for (let i = 0; i < items.length; i++) {
              if (items[i].type.indexOf('image') !== -1) {
                processImageFile(items[i].getAsFile());
                e.preventDefault();
                break;
              }
            }
          };
          window.addEventListener('paste', handlePaste);
          return () => window.removeEventListener('paste', handlePaste);
        }, [activeTab]);

        // ── 크롭: 사진 위를 드래그해 분석할 영역만 지정 ──────────────
        const cropBoxRef = useRef(null);
        const dragRef = useRef(null);

        // 화면 좌표 → 0~1 정규화 좌표 (표시 크기가 달라져도 안전)
        const pointNorm = (e) => {
          const r = cropBoxRef.current.getBoundingClientRect();
          return {
            x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
            y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)),
            rect: r,
          };
        };

        const onCropPointerDown = (e) => {
          if (e.button) return;
          const p = pointNorm(e);
          const tx = 18 / p.rect.width;   // 모서리 손잡이 인식 반경
          const ty = 18 / p.rect.height;
          let mode = 'draw';
          let anchor = { x: p.x, y: p.y };

          if (crop) {
            // 모서리를 잡으면 크기 조절(반대편 모서리를 기준점으로), 안쪽을 잡으면 이동
            const corners = [
              { x: crop.x0, y: crop.y0, ax: crop.x1, ay: crop.y1 },
              { x: crop.x1, y: crop.y0, ax: crop.x0, ay: crop.y1 },
              { x: crop.x0, y: crop.y1, ax: crop.x1, ay: crop.y0 },
              { x: crop.x1, y: crop.y1, ax: crop.x0, ay: crop.y0 },
            ];
            const hit = corners.find((c) => Math.abs(p.x - c.x) < tx && Math.abs(p.y - c.y) < ty);
            if (hit) {
              mode = 'resize';
              anchor = { x: hit.ax, y: hit.ay };
            } else if (p.x > crop.x0 && p.x < crop.x1 && p.y > crop.y0 && p.y < crop.y1) {
              mode = 'move';
              anchor = { x: p.x - crop.x0, y: p.y - crop.y0 };
            }
          }

          dragRef.current = { mode, anchor, start: crop };
          if (mode === 'draw') setCrop(null);
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
          e.preventDefault();
        };

        const onCropPointerMove = (e) => {
          const d = dragRef.current;
          if (!d) return;
          const p = pointNorm(e);
          if (d.mode === 'move') {
            const w = d.start.x1 - d.start.x0;
            const h = d.start.y1 - d.start.y0;
            const x0 = Math.min(1 - w, Math.max(0, p.x - d.anchor.x));
            const y0 = Math.min(1 - h, Math.max(0, p.y - d.anchor.y));
            setCrop({ x0, y0, x1: x0 + w, y1: y0 + h });
          } else {
            setCrop({
              x0: Math.min(d.anchor.x, p.x),
              y0: Math.min(d.anchor.y, p.y),
              x1: Math.max(d.anchor.x, p.x),
              y1: Math.max(d.anchor.y, p.y),
            });
          }
        };

        // 그냥 톡 누른 수준의 아주 작은 선택은 실수로 보고 해제
        const onCropPointerUp = (e) => {
          const d = dragRef.current;
          dragRef.current = null;
          if (!d) return;
          try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
          setCrop((c) => (c && (c.x1 - c.x0 < 0.02 || c.y1 - c.y0 < 0.02) ? null : c));
        };

        // ── 단어장 로직 ──────────────────────────────────────────────
        const loggedIn = isLocalMode || !!session;

        const savedMap = React.useMemo(() => {
          const m = new Map();
          for (const v of vocab) m.set(vocabKey(v.type, v.term), v.id);
          return m;
        }, [vocab]);

        const reloadVocab = async () => {
          try {
            setVocab(await vocabStore.list());
            setVocabError('');
          } catch (e) {
            console.error(e);
            setVocabError('단어장을 불러오지 못했습니다.');
          }
        };

        // 최초 진입: 로컬 모드면 바로, Supabase 모드면 기존 세션을 복원한 뒤 로드
        useEffect(() => {
          let alive = true;
          (async () => {
            if (isLocalMode) { await reloadVocab(); return; }
            const { data } = await sb.auth.getSession();
            if (!alive) return;
            setSession(data.session);
            if (data.session) await reloadVocab();
            sb.auth.onAuthStateChange((_e, sess) => {
              setSession(sess);
              if (sess) reloadVocab(); else setVocab([]);
            });
          })();
          return () => { alive = false; };
        }, []);

        // 단어/이디엄 저장 토글
        const toggleSave = async (type, term, meaning, sourceSentence) => {
          if (!loggedIn) {
            setVocabError('단어장을 쓰려면 먼저 로그인해 주세요.');
            setView('vocab');
            return;
          }
          const key = vocabKey(type, term);
          const existingId = savedMap.get(key);
          try {
            if (existingId !== undefined) {
              setVocab((list) => list.filter((v) => v.id !== existingId));   // 낙관적 갱신
              await vocabStore.remove(existingId);
            } else {
              const row = await vocabStore.add({
                type,
                term: String(term).trim(),
                meaning: String(meaning || '').trim(),
                source_sentence: sourceSentence || null,
              });
              setVocab((list) => [row, ...list]);
            }
            setVocabError('');
          } catch (e) {
            console.error(e);
            setVocabError('저장에 실패했습니다. 잠시 후 다시 시도해 주세요.');
            reloadVocab();
          }
        };

        const removeEntry = async (id) => {
          setVocab((list) => list.filter((v) => v.id !== id));
          try { await vocabStore.remove(id); } catch (e) { console.error(e); reloadVocab(); }
        };

        const handleAuth = async (email, password, mode) => {
          setVocabError(''); setVocabNotice('');
          if (mode === 'signup') {
            const { data, error: err } = await sb.auth.signUp({ email, password });
            if (err) {
              // 이 앱은 본인 계정만 쓰므로 신규 가입을 막아 두었다
              setVocabError(
                err.message && err.message.indexOf('Signups not allowed') !== -1
                  ? '이 단어장은 신규 가입을 받지 않습니다. 기존 계정으로 로그인해 주세요.'
                  : '계정을 만들지 못했습니다: ' + err.message
              );
              return;
            }
            // 이메일 확인이 켜져 있으면 세션 없이 확인 메일이 발송된다
            if (!data.session) {
              setVocabNotice('확인 메일을 보냈습니다. 메일의 링크를 눌러 인증한 뒤 로그인해 주세요.');
            }
            return;
          }
          const { error: err } = await sb.auth.signInWithPassword({ email, password });
          if (err) { setVocabError('로그인에 실패했습니다. 이메일/비밀번호를 확인해 주세요.'); return; }
        };

        const handleLogout = async () => { await sb.auth.signOut(); setVocab([]); };

        // 검색 + 필터가 적용된 목록
        const visibleVocab = vocab.filter((v) => {
          if (onlyUnknown && v.known) return false;
          const q = query.trim().toLowerCase();
          if (!q) return true;
          return (v.term + ' ' + v.meaning).toLowerCase().includes(q);
        });

        // ── 플래시카드 ──
        const shuffle = (arr) => {
          const a = arr.slice();
          for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
          }
          return a;
        };

        const startCards = (items) => {
          if (!items.length) return;
          setDeck(shuffle(items));
          setCardIdx(0);
          setFlipped(false);
          setCardResults({});
          setView('cards');
        };

        // 카드 채점: 저장이 실패해도 학습 흐름은 멈추지 않는다
        const gradeCard = async (entry, isKnown) => {
          setCardResults((r) => ({ ...r, [entry.id]: isKnown }));
          setCardIdx((i) => i + 1);
          setFlipped(false);

          const patch = {
            known: isKnown,
            review_count: (entry.review_count || 0) + 1,
            wrong_count: (entry.wrong_count || 0) + (isKnown ? 0 : 1),
            last_reviewed_at: new Date().toISOString(),
          };
          setVocab((list) => list.map((v) => (v.id === entry.id ? { ...v, ...patch } : v)));
          try { await vocabStore.update(entry.id, patch); }
          catch (e) { console.error(e); setVocabError('학습 기록을 저장하지 못했습니다.'); }
        };

        const analyzeContent = async () => {
          setError('');
          setResult(null);
          if (activeTab === 'text' && !textInput.trim()) return setError('분석할 영어 문장을 입력해 주세요.');
          if (activeTab === 'image' && !imagePreview) return setError('분석할 이미지를 업로드해 주세요.');

          setIsLoading(true);
          try {
            let body;
            if (activeTab === 'text') {
              body = { mode: 'text', text: textInput };
            } else {
              // 선택 영역이 있으면 원본에서 그 부분만 잘라 보낸다 (crop 이 null 이면 전체)
              const shot = await renderImage(originalSrc, crop);
              body = { mode: 'image', imageData: shot.base64, mimeType: shot.mimeType };
            }
            const res = await fetch('/api/analyze', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            const data = await res.json();
            if (!res.ok) throw new Error((data && data.error) || ('요청 실패 (' + res.status + ')'));
            if (!data.sentences) throw new Error('결과를 받아오지 못했습니다.');
            setResult(data);
          } catch (e) {
            console.error(e);
            setError(e.message || '분석 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
          } finally {
            setIsLoading(false);
          }
        };

        // 모델이 가끔 내용 없는 빈 문장 객체를 반환하므로 걸러냄
        const sentences = (result && Array.isArray(result.sentences) ? result.sentences : [])
          .filter((s) => s && s.original_sentence && s.original_sentence.trim());

        const cardDone = deck.length > 0 && cardIdx >= deck.length;
        const cardKnownCount = Object.values(cardResults).filter(Boolean).length;
        const cardWrongList = deck.filter((d) => cardResults[d.id] === false);
        const currentCard = deck[cardIdx];

        return (
          <div className="min-h-screen bg-slate-50 text-slate-800 p-4 md:p-8">
            <div className="max-w-4xl mx-auto space-y-6">

              <div className="text-center space-y-2 mb-8">
                <div className="inline-flex items-center justify-center p-3 bg-indigo-100 rounded-2xl mb-4 text-indigo-600 shadow-sm text-3xl">📖</div>
                <h1 className="text-3xl font-extrabold tracking-tight text-slate-900">Chunk &amp; Catch</h1>
                <p className="text-slate-500">원서 속 숨은 의미를 캐치하고, 문맥 단위로 끊어 읽으세요.</p>
                <div className="pt-2">
                  <button onClick={() => setView('vocab')}
                    className="inline-flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 rounded-xl text-slate-700 font-medium shadow-sm hover:border-emerald-300 hover:text-emerald-700 transition-colors">
                    📒 단어장
                    <span className="inline-flex items-center justify-center min-w-6 h-6 px-1.5 bg-emerald-100 text-emerald-700 rounded-full text-xs font-bold">{vocab.length}</span>
                  </button>
                </div>
              </div>

              {view === 'analyze' && (<>
              <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="flex border-b border-slate-100">
                  <button onClick={() => setActiveTab('image')}
                    className={'flex-1 flex items-center justify-center gap-2 py-4 font-medium transition-colors ' + (activeTab === 'image' ? 'text-indigo-600 border-b-2 border-indigo-600 bg-indigo-50/30' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-50')}>
                    📷 페이지 전체 업로드
                  </button>
                  <button onClick={() => setActiveTab('text')}
                    className={'flex-1 flex items-center justify-center gap-2 py-4 font-medium transition-colors ' + (activeTab === 'text' ? 'text-indigo-600 border-b-2 border-indigo-600 bg-indigo-50/30' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-50')}>
                    ⌨️ 여러 문장 타이핑
                  </button>
                </div>

                <div className="p-6 md:p-8 space-y-6">
                  {activeTab === 'image' && (
                    <div className="space-y-3">
                      <label className="block text-sm font-semibold text-slate-700">원서 페이지 업로드</label>
                      {!imagePreview ? (
                        <div className="relative group border-2 border-dashed border-slate-300 rounded-2xl bg-slate-50 hover:bg-indigo-50/50 transition-colors">
                          <input type="file" accept="image/*" onChange={handleImageUpload}
                            className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                          <div className="flex flex-col items-center justify-center p-12 text-slate-500 space-y-3">
                            <div className="text-4xl text-slate-400">⬆️</div>
                            <p className="font-medium text-center">클릭하여 파일 선택, 드래그 앤 드롭,<br />또는 화면 캡처 후 <strong className="text-indigo-600">Ctrl+V (붙여넣기)</strong></p>
                            <p className="text-xs text-slate-400">PNG, JPG 지원</p>
                          </div>
                        </div>
                      ) : (
                        <div className="space-y-3"
                          onDragOver={(e) => e.preventDefault()}
                          onDrop={(e) => { e.preventDefault(); processImageFile(e.dataTransfer.files[0]); }}>
                          <div className="flex justify-center">
                            <div ref={cropBoxRef}
                              onPointerDown={onCropPointerDown}
                              onPointerMove={onCropPointerMove}
                              onPointerUp={onCropPointerUp}
                              onPointerCancel={onCropPointerUp}
                              style={{ touchAction: 'none', cursor: 'crosshair' }}
                              className="relative overflow-hidden rounded-xl border border-slate-200 bg-slate-100 select-none">
                              <img src={imagePreview} alt="Preview" draggable={false}
                                className="block max-h-80 max-w-full w-auto pointer-events-none" />
                              {crop && (
                                <div className="absolute pointer-events-none"
                                  style={{
                                    left: crop.x0 * 100 + '%',
                                    top: crop.y0 * 100 + '%',
                                    width: (crop.x1 - crop.x0) * 100 + '%',
                                    height: (crop.y1 - crop.y0) * 100 + '%',
                                    boxShadow: '0 0 0 9999px rgba(15,23,42,0.55)',
                                    outline: '2px solid #6366f1',
                                  }}>
                                  {[['0%', '0%'], ['100%', '0%'], ['0%', '100%'], ['100%', '100%']].map((pos, i) => (
                                    <div key={i}
                                      className="absolute w-3 h-3 bg-white border-2 border-indigo-500 rounded-sm"
                                      style={{ left: pos[0], top: pos[1], transform: 'translate(-50%, -50%)' }} />
                                  ))}
                                </div>
                              )}
                            </div>
                          </div>

                          <div className={'flex items-start gap-2 p-3 rounded-xl text-sm ' + (crop ? 'bg-indigo-50 text-indigo-700' : 'bg-slate-50 text-slate-500')}>
                            {crop
                              ? <span>✂️ <strong>선택한 영역만</strong> 분석합니다. 모서리를 끌어 크기 조절, 안쪽을 끌어 이동할 수 있어요.</span>
                              : <span>💡 사진 위를 <strong>드래그</strong>해 원하는 문장만 선택하세요. 선택하지 않으면 전체를 분석합니다.</span>}
                          </div>

                          <div className="flex flex-wrap gap-2">
                            {crop && (
                              <button type="button" onClick={() => setCrop(null)}
                                className="px-4 py-2 rounded-xl border border-slate-300 text-slate-600 text-sm font-medium hover:bg-slate-50 transition-colors">
                                선택 해제 (전체 분석)
                              </button>
                            )}
                            <label className="px-4 py-2 rounded-xl border border-slate-300 text-slate-600 text-sm font-medium hover:bg-slate-50 cursor-pointer transition-colors">
                              사진 변경
                              <input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} />
                            </label>
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  {activeTab === 'text' && (
                    <div className="space-y-3">
                      <label className="block text-sm font-semibold text-slate-700">해석이 어려운 영어 문장들 (여러 문장 가능)</label>
                      <textarea
                        className="w-full h-40 p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all resize-none"
                        placeholder="여러 문장을 한 번에 입력하셔도 됩니다. 예: I couldn't put up with his behavior anymore. So I decided to call off the meeting."
                        value={textInput}
                        onChange={(e) => setTextInput(e.target.value)} />
                    </div>
                  )}

                  {error && (
                    <div className="flex items-center gap-2 p-4 bg-red-50 text-red-700 rounded-xl text-sm">⚠️ {error}</div>
                  )}

                  <button onClick={analyzeContent} disabled={isLoading}
                    className="w-full py-4 bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300 text-white font-bold rounded-2xl shadow-sm hover:shadow-md transition-all flex items-center justify-center gap-2">
                    {isLoading ? (<><span className="spin inline-block">⏳</span> 전체 문장 분석 중...</>) : (<>전체 분석하기 →</>)}
                  </button>
                </div>
              </div>

              {sentences.length > 0 && (
                <div className="space-y-8">
                  <div className="flex items-center gap-2 text-indigo-700 font-bold px-2">
                    📋 <h2 className="text-xl">총 {sentences.length}개의 문장이 분석되었습니다.</h2>
                  </div>

                  {sentences.map((s, sIndex) => (
                    <div key={sIndex} className="bg-white rounded-3xl shadow-md border border-slate-200 overflow-hidden">
                      <div className="p-5 bg-slate-800 text-white flex gap-4 items-start relative">
                        <div className="flex-shrink-0 bg-slate-700 text-slate-300 w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm">{sIndex + 1}</div>
                        <p className="font-serif text-lg leading-relaxed mt-1 flex-1 pr-20">{s.original_sentence}</p>
                        <div className="flex flex-col sm:flex-row gap-2 shrink-0 absolute top-5 right-5 sm:relative sm:top-0 sm:right-0">
                          <button onClick={() => handleSpeak(s.original_sentence, 'en-US')}
                            className="flex items-center gap-1.5 text-xs bg-slate-700 hover:bg-indigo-500 px-3 py-2 rounded-xl transition-colors text-slate-200 hover:text-white" title="미국 발음">🔊 🇺🇸 US</button>
                          <button onClick={() => handleSpeak(s.original_sentence, 'en-GB')}
                            className="flex items-center gap-1.5 text-xs bg-slate-700 hover:bg-emerald-500 px-3 py-2 rounded-xl transition-colors text-slate-200 hover:text-white" title="영국 발음">🔊 🇬🇧 UK</button>
                        </div>
                      </div>

                      <div className="p-6 md:p-8 space-y-6">
                        <div>
                          <div className="flex items-center gap-2 mb-4 text-indigo-600 font-bold">✂️ 스마트 끊어 읽기</div>
                          <div className="space-y-4">
                            {(s.chunks || []).map((chunk, cIndex) => (
                              <div key={cIndex} className="flex flex-col gap-1.5 pl-4 border-l-2 border-slate-100">
                                <div className="flex flex-col md:flex-row md:items-baseline gap-2">
                                  <span className="text-lg font-bold text-slate-800">{chunk.english}</span>
                                  <span className="text-slate-500">({chunk.korean})</span>
                                </div>
                                {chunk.is_idiom && (
                                  <div className="mt-2 mb-1 flex items-start gap-2 p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-900 text-sm">
                                    💡
                                    <div className="flex-1">
                                      <strong className="block text-amber-700 mb-1">[핵심 구동사/이디엄]</strong>
                                      {chunk.idiom_explanation}
                                      <div className="mt-2">
                                        {(() => {
                                          const saved = savedMap.has(vocabKey('idiom', chunk.english));
                                          return (
                                            <button type="button"
                                              onClick={() => toggleSave('idiom', chunk.english, chunk.idiom_explanation, s.original_sentence)}
                                              className={'inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium border transition-colors ' + (saved
                                                ? 'bg-amber-600 border-amber-600 text-white'
                                                : 'bg-white border-amber-300 text-amber-700 hover:bg-amber-100')}>
                                              {saved ? '✓ 단어장에 있음' : '＋ 단어장에 담기'}
                                            </button>
                                          );
                                        })()}
                                      </div>
                                    </div>
                                  </div>
                                )}
                              </div>
                            ))}
                          </div>
                        </div>

                        {s.syntax && (s.syntax.structure || (s.syntax.points && s.syntax.points.length > 0)) && (
                          <div>
                            <div className="flex items-center gap-2 mb-3 text-sky-600 font-bold">🔗 구문 뜯어보기</div>
                            {s.syntax.structure && (
                              <div className="mb-3 p-3 bg-sky-50 border border-sky-200 rounded-xl text-sky-900 text-sm font-medium leading-relaxed">{s.syntax.structure}</div>
                            )}
                            {s.syntax.points && s.syntax.points.length > 0 && (
                              <div className="space-y-2.5">
                                {s.syntax.points.map((pt, pIndex) => (
                                  <div key={pIndex} className="flex flex-col gap-0.5 pl-4 border-l-2 border-sky-100">
                                    <span className="font-semibold text-sky-700 text-sm">{pt.label}</span>
                                    <span className="text-slate-600 text-sm leading-relaxed">{pt.detail}</span>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        )}

                        {s.vocabulary && s.vocabulary.length > 0 && (
                          <div>
                            <div className="flex items-center gap-2 mb-3 text-emerald-600 font-bold">🏷️ 핵심 단어 노트</div>
                            <div className="flex flex-wrap gap-2">
                              {s.vocabulary.map((v, vIndex) => {
                                const saved = savedMap.has(vocabKey('word', v.word));
                                return (
                                  <button key={vIndex} type="button"
                                    onClick={() => toggleSave('word', v.word, v.meaning, s.original_sentence)}
                                    title={saved ? '단어장에서 빼기' : '단어장에 담기'}
                                    className={'inline-flex items-center gap-2 p-2 px-3 rounded-xl text-sm shadow-sm border transition-colors ' + (saved
                                      ? 'bg-emerald-600 border-emerald-600 text-white'
                                      : 'bg-emerald-50 border-emerald-200 text-emerald-900 hover:bg-emerald-100')}>
                                    <span className={'font-bold ' + (saved ? 'text-white' : 'text-emerald-700')}>{v.word}</span>
                                    <span className={saved ? 'text-emerald-200' : 'text-emerald-300'}>|</span>
                                    <span>{v.meaning}</span>
                                    <span className={'ml-0.5 font-bold ' + (saved ? 'text-white' : 'text-emerald-400')}>{saved ? '✓' : '＋'}</span>
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        )}

                        <hr className="border-slate-100" />

                        <div>
                          <div className="flex items-center gap-2 mb-3 text-indigo-600 font-bold">📖 최종 해석</div>
                          <p className="text-slate-800 font-medium leading-relaxed bg-slate-50 p-4 rounded-2xl">{s.final_translation}</p>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
              </>)}

              {view === 'vocab' && (
                <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-4">
                  <div className="flex items-center justify-between gap-3">
                    <button onClick={() => setView('analyze')}
                      className="text-slate-500 hover:text-slate-800 font-medium">← 돌아가기</button>
                    {!isLocalMode && session && (
                      <button onClick={handleLogout} className="text-sm text-slate-400 hover:text-slate-600">로그아웃</button>
                    )}
                  </div>

                  <h2 className="text-2xl font-extrabold text-slate-900">📒 내 단어장</h2>

                  {vocabError && (
                    <div className="p-3 bg-red-50 text-red-700 rounded-xl text-sm">⚠️ {vocabError}</div>
                  )}
                  {vocabNotice && (
                    <div className="p-3 bg-emerald-50 text-emerald-700 rounded-xl text-sm">✉️ {vocabNotice}</div>
                  )}

                  {!loggedIn ? (
                    <LoginForm onSubmit={handleAuth} />
                  ) : vocab.length === 0 ? (
                    <div className="p-10 text-center text-slate-400 leading-relaxed">
                      아직 담은 단어가 없습니다.<br />
                      분석 결과의 <strong className="text-emerald-600">🏷️ 핵심 단어</strong>를 터치하면 여기에 쌓입니다.
                    </div>
                  ) : (
                    <div className="space-y-4">
                      <input value={query} onChange={(e) => setQuery(e.target.value)}
                        placeholder="단어 또는 뜻으로 검색"
                        className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />

                      <div className="flex flex-wrap items-center gap-2">
                        <button onClick={() => { setHideMeaning(!hideMeaning); setRevealed({}); }}
                          className={'px-3 py-2 rounded-xl text-sm font-medium border transition-colors ' + (hideMeaning
                            ? 'bg-indigo-600 border-indigo-600 text-white'
                            : 'bg-white border-slate-300 text-slate-600 hover:bg-slate-50')}>
                          {hideMeaning ? '🙈 뜻 가리는 중' : '👁️ 뜻 가리기'}
                        </button>
                        <button onClick={() => setOnlyUnknown(!onlyUnknown)}
                          className={'px-3 py-2 rounded-xl text-sm font-medium border transition-colors ' + (onlyUnknown
                            ? 'bg-amber-500 border-amber-500 text-white'
                            : 'bg-white border-slate-300 text-slate-600 hover:bg-slate-50')}>
                          {onlyUnknown ? '못 외운 것만' : '전체 보기'}
                        </button>
                        <button onClick={() => startCards(visibleVocab)} disabled={!visibleVocab.length}
                          className="px-4 py-2 rounded-xl text-sm font-bold bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white transition-colors">
                          🎴 카드 학습 ({visibleVocab.length})
                        </button>
                      </div>

                      <div className="space-y-2">
                        {visibleVocab.map((v) => {
                          const open = !hideMeaning || revealed[v.id];
                          return (
                            <div key={v.id} className="flex items-start gap-3 p-3 border border-slate-200 rounded-xl hover:border-slate-300 transition-colors">
                              <div className="flex-1 min-w-0">
                                <div className="flex items-center gap-2 flex-wrap">
                                  <strong className="text-slate-900">{v.term}</strong>
                                  {v.type === 'idiom' && (
                                    <span className="text-[11px] px-1.5 py-0.5 bg-amber-100 text-amber-700 rounded">구동사</span>
                                  )}
                                  {v.known && (
                                    <span className="text-[11px] px-1.5 py-0.5 bg-emerald-100 text-emerald-700 rounded">외움</span>
                                  )}
                                </div>
                                <div onClick={() => setRevealed((r) => ({ ...r, [v.id]: true }))}
                                  className={'mt-1 text-sm ' + (open ? 'text-slate-600' : 'bg-slate-200 text-transparent rounded cursor-pointer select-none')}>
                                  {open ? v.meaning : '뜻 보기'}
                                </div>
                                {v.source_sentence && (
                                  <p className="mt-1.5 text-xs text-slate-400 italic truncate">{v.source_sentence}</p>
                                )}
                              </div>
                              <button onClick={() => removeEntry(v.id)}
                                className="shrink-0 text-slate-300 hover:text-red-500 transition-colors px-1" title="삭제">✕</button>
                            </div>
                          );
                        })}
                        {!visibleVocab.length && (
                          <p className="p-6 text-center text-slate-400 text-sm">조건에 맞는 단어가 없습니다.</p>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {view === 'cards' && (
                <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-5">
                  {!cardDone && currentCard ? (
                    <>
                      <div className="flex items-center justify-between gap-3">
                        <button onClick={() => setView('vocab')}
                          className="text-slate-500 hover:text-slate-800 font-medium">← 단어장</button>
                        <div className="flex items-center gap-3">
                          <button onClick={() => handleSpeak(currentCard.term, 'en-US')}
                            className="text-slate-400 hover:text-indigo-600 transition-colors" title="발음 듣기">🔊</button>
                          <span className="text-sm text-slate-400 font-medium">{cardIdx + 1} / {deck.length}</span>
                        </div>
                      </div>

                      <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden">
                        <div className="h-full bg-emerald-500 transition-all"
                          style={{ width: (cardIdx / deck.length) * 100 + '%' }} />
                      </div>

                      <div onClick={() => setFlipped((f) => !f)}
                        className="min-h-56 flex flex-col items-center justify-center text-center gap-3 p-6 bg-slate-50 border-2 border-slate-200 rounded-2xl cursor-pointer select-none hover:border-indigo-300 transition-colors">
                        {!flipped ? (
                          <>
                            <div className="text-3xl font-extrabold text-slate-900 break-words">{currentCard.term}</div>
                            <div className="text-sm text-slate-400">탭하면 뜻이 보입니다</div>
                          </>
                        ) : (
                          <>
                            <div className="text-2xl font-bold text-indigo-700 break-words">{currentCard.meaning}</div>
                            {currentCard.source_sentence && (
                              <p className="text-sm text-slate-500 italic leading-relaxed">{currentCard.source_sentence}</p>
                            )}
                          </>
                        )}
                      </div>

                      {flipped && (
                        <div className="grid grid-cols-2 gap-3">
                          <button onClick={() => gradeCard(currentCard, false)}
                            className="py-4 rounded-2xl font-bold bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 transition-colors">
                            ❌ 몰라요
                          </button>
                          <button onClick={() => gradeCard(currentCard, true)}
                            className="py-4 rounded-2xl font-bold bg-emerald-600 text-white hover:bg-emerald-700 transition-colors">
                            ✅ 알아요
                          </button>
                        </div>
                      )}
                    </>
                  ) : (
                    <div className="text-center space-y-5 py-6">
                      <div className="text-5xl">🎉</div>
                      <h2 className="text-2xl font-extrabold text-slate-900">학습 완료!</h2>
                      <p className="text-slate-600">
                        총 <strong>{deck.length}</strong>장 중{' '}
                        <strong className="text-emerald-600">{cardKnownCount}개</strong>를 외웠고,{' '}
                        <strong className="text-red-500">{cardWrongList.length}개</strong>가 남았습니다.
                      </p>
                      <div className="flex flex-col sm:flex-row gap-3 justify-center">
                        {cardWrongList.length > 0 && (
                          <button onClick={() => startCards(cardWrongList)}
                            className="px-6 py-3 rounded-2xl font-bold bg-indigo-600 text-white hover:bg-indigo-700 transition-colors">
                            모르는 것만 다시 ({cardWrongList.length})
                          </button>
                        )}
                        <button onClick={() => setView('vocab')}
                          className="px-6 py-3 rounded-2xl font-bold border border-slate-300 text-slate-600 hover:bg-slate-50 transition-colors">
                          단어장으로
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}

            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
